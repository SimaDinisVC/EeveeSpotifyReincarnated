name: Sincronizar Fork

on:
  schedule:
    - cron: '0 0 * * *' # Corre todos os dias à meia-noite
  workflow_dispatch: # Permite-te correr manualmente quando quiseres

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Descarrega o histórico completo para evitar erros de referências

      - name: Sincronizar com o Upstream
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # LINK CORRIGIDO: Aponta diretamente para o repositório original completo
          git remote add upstream https://github.com
          
          # Descarrega as novidades do original
          git fetch upstream
          
          # DETEÇÃO AUTOMÁTICA: Descobre se a branch principal é main ou master
          if git show-ref --verify --quiet refs/heads/main; then
            BRANCH="main"
          else
            BRANCH="master"
          fi
          
          echo "A branch ativa detetada é: $BRANCH"
          git checkout $BRANCH
          
          # Junta as alterações de forma segura
          git merge upstream/$BRANCH --ff-only || git merge upstream/$BRANCH -m "Merge upstream changes" --allow-unrelated-histories
          
          # Envia a atualização para o teu fork no GitHub
          git push origin $BRANCH
