name: Sincronizar Fork

on:
  schedule:
    - cron: '0 0 * * *' # Corre todos os dias à meia-noite
  workflow_dispatch: # Permite-te correr manualmente se quiseres

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sincronizar com o Upstream
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # Substitui pelo URL do repositório original (don@/repo-original.git)
          git remote add upstream https://github.com
          git fetch upstream
          git checkout main # ou master
          git merge upstream/main --ff-only
          git push origin main
