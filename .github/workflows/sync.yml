name: Sincronizar Fork

on:
  schedule:
    - cron: '0 0 * * *' # Corre todos os dias à meia-noite
  workflow_dispatch: # Permite correr manualmente quando quiseres

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sincronizar com o Upstream
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Adiciona o repositório original correto
          git remote add upstream https://github.com
          
          # Descarrega as novidades
          git fetch upstream
          git checkout main
          
          # Junta as alterações (tenta Fast-Forward, se não der, faz um merge normal)
          git merge upstream/main --ff-only || git merge upstream/main -m "Merge upstream changes"
          
          # Envia para o teu fork
          git push origin main
