name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # Corre todos os dias à meia-noite
  workflow_dispatch: # Permite-te clicar no botão para sincronizar manualmente

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Força o download de todas as branches e histórico

      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          target_sync_branch: master # AJUSTADO: mudado de 'main' para 'master'
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_branch: master # AJUSTADO: mudado de 'main' para 'master'
          upstream_sync_repo: SideloadLabs/EeveeSpotifyReincarnated
