name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # Corre todos os dias à meia-noite. Pode mudar o cron se quiser.
  workflow_dispatch: # Permite-lhe clicar num botão para sincronizar manualmente quando quiser.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          target_sync_branch: main # Mude para 'master' se o seu ramo principal for master
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_branch: main
          upstream_sync_repo: SideloadLabs/EeveeSpotifyReincarnated
